<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Market - Faisalabad Market</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f2f2;padding-bottom:95px}
header{background:#111;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;position:sticky;top:0;z-index:99}
.logo-box{background:#000;border:2px solid #fff;border-radius:10px;padding:4px 10px;font-weight:900;font-size:22px;color:#fff}
.logo-box span{color:#00a651}
header small{color:#fff;font-size:11px;letter-spacing:1px}
.hicons{color:#fff;font-size:20px;display:flex;gap:14px}
.welcome{background:#111;color:#fff;margin:12px;border-radius:16px;padding:20px}
.welcome h2{font-size:22px}.welcome h2 span{color:#00c853}
.welcome p{font-size:13px;opacity:.85;margin:8px 0 14px}
.btn-row{display:flex;gap:10px}
.btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:800;cursor:pointer}
.btn-green{background:#00a651;color:#fff}.btn-white{background:#fff;color:#111}
.cats{display:flex;gap:8px;padding:0 12px;overflow-x:auto}
.cat{min-width:78px;background:#fff;border-radius:12px;padding:12px 4px;text-align:center;font-size:11px;font-weight:700;cursor:pointer}
.cat.active{background:#00a651;color:#fff}
.cat i{display:block;font-size:20px}
.search-box{padding:12px}
.search-box input{width:100%;padding:13px;border-radius:12px;border:1px solid #ddd;outline:none}
.filters{display:flex;gap:8px;padding:0 12px;overflow-x:auto;white-space:nowrap}
.filters button,.filters select{padding:8px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer}
.filters button.active{background:#00a651;color:#fff;border-color:#00a651}
.ads{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 5px #0001;position:relative;cursor:pointer}
.card img{width:100%;height:150px;object-fit:cover}
.card .in{padding:10px}
.price{color:#00a651;font-weight:900;font-size:16px}
.title{font-size:13px;font-weight:700;margin:4px 0;height:32px;overflow:hidden}
.meta{font-size:11px;color:#777}
.top{position:absolute;top:8px;left:8px;background:#00a651;color:#fff;font-size:10px;padding:4px 8px;border-radius:6px;font-weight:800}
.cond{position:absolute;bottom:58px;left:8px;background:#111;color:#fff;font-size:10px;padding:3px 7px;border-radius:6px}
.fav{position:absolute;top:8px;right:8px;background:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;align-items:center;padding:10px 0 14px;border-top:1px solid #eee;z-index:99}
.bottom div{text-align:center;font-size:11px;color:#555;cursor:pointer}.bottom div.active{color:#00a651;font-weight:800}
.plus{width:52px;height:52px;background:linear-gradient(135deg,#111,#00a651);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-28px;border:3px solid #fff}
.modal-bg{display:none;position:fixed;inset:0;background:#0008;z-index:999;align-items:flex-start;justify-content:center;overflow-y:auto}
.modal{background:#fff;width:100%;max-width:480px;min-height:100vh;padding:16px}
.modal input,.modal select,.modal textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
.detail-img{width:100%;height:280px;object-fit:cover;border-radius:14px}
.seller{background:#f8f8f8;padding:12px;border-radius:12px;margin:12px 0;display:flex;gap:10px;align-items:center}
.avatar{width:44px;height:44px;background:#111;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
.action-row{display:flex;gap:8px;margin:12px 0}
.action-row button{flex:1;padding:14px;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:15px}
.callB{background:#00a651;color:#fff}.waB{background:#25D366;color:#fff}
.safety{background:#fff8e1;padding:12px;border-radius:12px;font-size:12px;margin:10px 0}
.chip{display:inline-block;background:#eee;padding:5px 10px;border-radius:20px;font-size:11px;margin:3px}
</style>
</head>
<body>
<header><div><div class="logo-box">S<span>M</span></div><small>FAISALABAD MARKET</small></div><div class="hicons"><span>🔔</span><span onclick="openProfile()">👤</span></div></header>
<div class="welcome"><h2>Welcome to <span>SM Market!</span></h2><p>Pakistan's Own Buy & Sell Market</p><div class="btn-row"><button class="btn btn-green" onclick="openPost()">+ Post Free Ad</button><button class="btn btn-white" onclick="document.getElementById('ads').scrollIntoView({behavior:'smooth'})">Browse Ads</button></div></div>
<div class="cats" id="catBar"></div>
<div class="search-box"><input id="searchInput" type="text" placeholder="Search in SM Market..." autocomplete="off" autocorrect="off" spellcheck="false" oninput="applyAll()"></div>
<div class="filters">
<select id="cityF" onchange="applyAll()"><option value="all">All Cities</option><option>Faisalabad</option><option>Gojra</option><option>Lahore</option><option>Karachi</option></select>
<select id="sortF" onchange="applyAll()"><option value="new">Newest First</option><option value="low">Price Low-High</option><option value="high">Price High-Low</option></select>
<input id="minP" type="text" placeholder="Min Rs" style="width:90px" oninput="formatInputPrice(this);applyAll()">
<input id="maxP" type="text" placeholder="Max Rs" style="width:90px" oninput="formatInputPrice(this);applyAll()">
<button onclick="setTime('today',this)">Today</button><button onclick="setTime('all',this)" class="active">All Time</button>
</div>
<div id="hist" style="padding:0 12px;font-size:12px;color:#777"></div>
<div class="ads" id="ads"></div>
<div class="bottom"><div class="active">🏠<br>Home</div><div onclick="showFavs()">❤️<br>Favourites</div><div><div class="plus" onclick="openPost()">+</div></div><div onclick="showMyAds()">📋<br>My Ads</div><div onclick="openProfile()">👤<br>Profile</div></div>
<div id="postModal" class="modal-bg"><div class="modal"><h3>Post Free Ad</h3>
<input id="pTitle" placeholder="Title" autocomplete="off">
<input id="pPrice" type="text" placeholder="Price - e.g. 50,000" autocomplete="off" oninput="formatInputPrice(this)">
<select id="pCat"><option>Motors</option><option>Mobiles</option><option>Property</option><option>Home</option><option>Jobs</option><option>Fashion</option><option>Electronics</option><option>Animals</option></select>
<select id="pCond"><option>Used</option><option>New</option></select>
<select id="pCity"><option>Faisalabad</option><option>Gojra</option><option>Lahore</option><option>Karachi</option></select>
<input id="pPhone" placeholder="WhatsApp Number - 0300xxxxxxx" autocomplete="off">
<input id="pImg" placeholder="Photo Link (optional)">
<input type="file" id="pFile" accept="image/*" onchange="previewImg(this)">
<img id="pPreview" style="width:100%;border-radius:10px;display:none">
<textarea id="pDesc" placeholder="Description..."></textarea>
<label><input type="checkbox" id="pBoost"> ⭐ Boost Ad - TOP pe dikhao (Rs 299)</label><br><br>
<button class="btn btn-green" onclick="addAd()">Publish Ad</button>
<button class="btn" style="background:#eee;margin-top:8px" onclick="closePost()">Cancel</button></div></div>
<div id="detailModal" class="modal-bg"><div class="modal" id="detailContent"></div></div>
<div id="profileModal" class="modal-bg"><div class="modal"><h3>My Profile</h3><div class="seller"><div class="avatar">A</div><div><b>Atiq Jutt ✓ Verified</b><br><small>Member since 2024 • Faisalabad</small></div></div><p style="font-size:13px">Email: Sirf yahan dikhega</p><p style="font-size:13px;margin-top:8px">My Ads: <span id="myCount">0</span> • Favourites: <span id="favCount">0</span></p><button class="btn btn-green" style="margin-top:14px" onclick="alert('Edit Profile')">Edit Profile</button><button class="btn" style="background:#eee;margin-top:8px" onclick="closeProfile()">Close</button></div></div>
<script>
let cats=["All","Motors","Mobiles","Property","Home","Jobs","Fashion","Electronics","Animals"];
let curCat="All", curTime="all";
function formatPrice(n){ return Number(n).toLocaleString('en-PK'); }
function formatInputPrice(input){ let v=input.value.replace(/[^0-9]/g,''); if(v){ input.value=Number(v).toLocaleString('en-PK'); } }
function cleanPrice(v){ return parseInt(String(v).replace(/,/g,''))||0; }
let ads=[
{title:"Honda CG 125 2023",price:285000,city:"Faisalabad",cat:"Motors",cond:"Used",img:"https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=600",top:true,views:1240,time:"2 hours ago",desc:"Neat condition, original documents.",seller:"Atiq Jutt",phone:"03001234567",mine:false},
{title:"iPhone 13 Pro 256GB",price:185000,city:"Faisalabad",cat:"Mobiles",cond:"Used",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600",top:true,views:890,time:"5 hours ago",desc:"PTA Approved, Battery 88%.",seller:"Bilal Ahmed",phone:"03019876543",mine:false},
{title:"5 Marla House For Sale",price:8500000,city:"Faisalabad",cat:"Property",cond:"New",img:"https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=600",top:false,views:450,time:"Today",desc:"5 Marla new house.",seller:"Usman Ghani",phone:"03001112222",mine:false},
{title:"Suzuki Mehran 2018",price:950000,city:"Gojra",cat:"Motors",cond:"Used",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600",top:false,views:670,time:"Today",desc:"Family car, AC working.",seller:"Hamza Ali",phone:"03003334444",mine:false},
{title:"Sofa Set 7 Seater",price:85000,city:"Faisalabad",cat:"Home",cond:"Used",img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600",top:false,views:320,time:"Yesterday",desc:"Shisham wood.",seller:"Ayesha Khan",phone:"03005556666",mine:false},
{title:"Honda 70 2024 New",price:145000,city:"Lahore",cat:"Motors",cond:"New",img:"https://images.unsplash.com/photo-1449426468159-d96dbf08f19?w=600",top:true,views:980,time:"1 hour ago",desc:"Zero meter.",seller:"Atiq Jutt",phone:"03001234567",mine:true},
];
let favs=new Set(); let history=[];
function renderCats(){ document.getElementById('catBar').innerHTML=cats.map(c=>`<div class="cat ${c===curCat?'active':''}" onclick="setCat('${c}')"><i>${c==='All'?'📦':c==='Motors'?'🚗':c==='Mobiles'?'📱':c==='Property'?'🏠':c==='Jobs'?'💼':c==='Fashion'?'👕':c==='Electronics'?'💻':'🐄'}</i>${c}</div>`).join('') }
function setCat(c){curCat=c;renderCats();applyAll()}
function setTime(t,btn){curTime=t;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');applyAll()}
function applyAll(){
let q=document.getElementById('searchInput').value.toLowerCase();
if(q && !history.includes(q)){history.unshift(q);history=history.slice(0,3);document.getElementById('hist').innerHTML='Recent: '+history.map(h=>`<span class="chip" onclick="document.getElementById('searchInput').value='${h}';applyAll()">${h}</span>`).join('')}
let l=ads.filter(a=>(curCat==='All'||a.cat===curCat)&&(a.title.toLowerCase().includes(q)||a.city.toLowerCase().includes(q)));
let city=document.getElementById('cityF').value; if(city!=='all') l=l.filter(a=>a.city===city);
let min=cleanPrice(document.getElementById('minP').value), max=cleanPrice(document.getElementById('maxP').value); if(min) l=l.filter(a=>a.price>=min); if(max) l=l.filter(a=>a.price<=max);
if(curTime==='today') l=l.slice(0,4);
let s=document.getElementById('sortF').value; if(s==='low') l.sort((a,b)=>a.price-b.price); if(s==='high') l.sort((a,b)=>b.price-a.price); if(s==='new') l.sort((a,b)=>b.top-a.top);
render(l);
}
function render(list){
if(!list.length){document.getElementById('ads').innerHTML='<p style="grid-column:1/3;text-align:center;padding:30px">Koi Ad Nahi Mila</p>';return}
document.getElementById('ads').innerHTML=list.map(a=>{let i=ads.indexOf(a);return `<div class="card" onclick="openDetail(${i})">${a.top?'<div class="top">TOP Ad</div>':''}<div class="fav" onclick="event.stopPropagation();toggleFav(${i},this)">${favs.has(i)?'❤️':'🤍'}</div><div class="cond">${a.cond}</div><img src="${a.img}"><div class="in"><div class="price">Rs ${formatPrice(a.price)}</div><div class="title">${a.title}</div><div class="meta">📍 ${a.city} • ${a.time} • 👁️ ${a.views}</div></div></div>`}).join('');
document.getElementById('myCount').innerText=ads.filter(a=>a.mine).length; document.getElementById('favCount').innerText=favs.size;
}
function toggleFav(i,el){ if(favs.has(i)){favs.delete(i);el.innerHTML='🤍'}else{favs.add(i);el.innerHTML='❤️'} applyAll(); }
function openDetail(i){ let a=ads[i]; a.views++;
document.getElementById('detailContent').innerHTML=`<button onclick="closeDetail()" style="padding:8px 12px;border:none;border-radius:8px">← Back</button><img class="detail-img" src="${a.img}"><h2 style="margin:10px 0 4px">Rs ${formatPrice(a.price)}</h2><h3>${a.title}</h3><p style="font-size:12px;color:#777;margin:6px 0">📍 ${a.city} • ${a.time} • 👁️ ${a.views} views • ${a.cond} • ${a.cat}</p><p>${a.desc}</p><div class="seller"><div class="avatar">${a.seller[0]}</div><div><b>${a.seller} ✓ Verified</b><br><small>Member since 2024 • ${a.city}</small></div></div><div class="action-row"><button class="callB" onclick="window.location.href='tel:${a.phone}'">📞 Direct Call</button><button class="waB" onclick="window.open('https://wa.me/92${a.phone.substring(1)}','_blank')">🟢 WhatsApp</button></div><p style="text-align:center;font-size:12px;color:#777">Number: ${a.phone} - No Chat - Direct Baat</p><div class="safety">⚠️ Mil ke deal karo • Advance na bhejo • Cheez check kar ke lo</div><div style="display:flex;gap:8px"><button class="btn" style="background:#eee" onclick="alert('Link Copy Ho Gaya!')">🔗 Share</button><button class="btn" style="background:#ffecec" onclick="alert('Report kar diya')">🚩 Report</button>${a.mine?`<button class="btn" style="background:#111;color:#fff" onclick="markSold(${i})">Sold Mark</button>`:''}</div>${a.mine?`<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-green" onclick="alert('Edit Ad')">Edit</button><button class="btn" style="background:#ffdddd" onclick="delAd(${i})">Delete</button><button class="btn" style="background:#ffd700" onclick="alert('Boost Active!')">⭐ Boost</button></div>`:''}`;
document.getElementById('detailModal').style.display='flex'; render(ads);
}
function closeDetail(){document.getElementById('detailModal').style.display='none'}
function markSold(i){ads[i].title+=' [SOLD]';alert('Sold Mark Ho Gaya!');closeDetail();applyAll()}
function delAd(i){if(confirm('Delete karna hai?')){ads.splice(i,1);closeDetail();applyAll()}}
function openPost(){document.getElementById('postModal').style.display='flex'}
function closePost(){document.getElementById('postModal').style.display='none'}
function previewImg(inp){ if(inp.files[0]){let r=new FileReader();r.onload=e=>{document.getElementById('pPreview').src=e.target.result;document.getElementById('pPreview').style.display='block'};r.readAsDataURL(inp.files[0])} }
function addAd(){ let t=document.getElementById('pTitle').value, p=cleanPrice(document.getElementById('pPrice').value); if(!t||!p){alert('Title aur Price zaroori hai!');return} let img=document.getElementById('pPreview').src||document.getElementById('pImg').value||"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600"; ads.unshift({title:t,price:p,city:document.getElementById('pCity').value,cat:document.getElementById('pCat').value,cond:document.getElementById('pCond').value,img:img,top:document.getElementById('pBoost').checked,views:0,time:"Just Now",desc:document.getElementById('pDesc').value||"Good condition.",seller:"Atiq Jutt",phone:document.getElementById('pPhone').value||"03001234567",mine:true}); closePost(); applyAll(); alert('Ad Publish Ho Gaya!'); }
function showFavs(){ if(!favs.size){alert('Koi Favourite nahi');return} render([...favs].map(i=>ads[i])) }
function showMyAds(){ render(ads.filter(a=>a.mine)); alert('Sirf Tumhare Ads dikh rahe hain') }
function openProfile(){document.getElementById('profileModal').style.display='flex'}
function closeProfile(){document.getElementById('profileModal').style.display='none'}
renderCats(); render(ads);
</script>
</body>
</html>
