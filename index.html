<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM FAISALABAD MARKET - Full OLX Clone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{--dark:#002f34;--blue:#3a77ff;--border:#d8dfe0;--bg:#f2f4f5}
body{background:var(--bg);color:var(--dark)}
.header{background:var(--bg);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{font-weight:800;font-size:18px}.logo span{color:var(--blue)}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--dark);background:#fff;font-weight:700;font-size:12px;cursor:pointer}
.btn-dark{background:var(--dark);color:#fff}
.auth-bar{background:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;border-bottom:1px solid var(--border)}
.search-bar{background:#fff;padding:10px 12px;display:flex;gap:8px;border-bottom:1px solid var(--border);position:sticky;top:48px;z-index:90}
.search-bar input{flex:1;padding:12px;border:1px solid var(--dark);border-radius:6px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--border)}
.chip{white-space:nowrap;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:11px;font-weight:600;cursor:pointer}
.chip.active{background:var(--dark);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
.card img{width:100%;height:160px;object-fit:cover}
.heart{position:absolute;top:8px;right:8px;background:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.card-body{padding:8px}
.price{font-weight:800;font-size:14px}
.title{font-size:12px;height:32px;overflow:hidden;margin:3px 0}
.meta{font-size:10px;color:#6b7c80}
.page{display:none;padding-bottom:90px}.page.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:200}
.nav{border:none;background:none;font-size:10px;font-weight:700;color:#6b7c80;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.nav.active{color:var(--dark)}
.sell-fab{background:var(--dark);color:#fff;width:50px;height:32px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.form{max-width:600px;margin:0 auto;padding:16px;background:#fff;min-height:100vh}
.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;margin-bottom:12px;font-size:13px}
.form label{font-size:12px;font-weight:700;margin-bottom:4px;display:block}
.submit{background:var(--dark);color:#fff;width:100%;padding:14px;border:none;border-radius:6px;font-weight:800;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal.open{display:flex}
.box{background:#fff;border-radius:12px;max-width:360px;width:100%;padding:20px}
.box input{width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;margin-bottom:10px}
.detail-img{width:100%;height:300px;object-fit:cover}
.detail-body{padding:14px;background:#fff}
.chat-list{padding:10px}.chat-item{background:#fff;border:1px solid var(--border);padding:12px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="header"><div class="logo">SM <span>FAISALABAD</span> MARKET</div><div class="top-actions"><button class="btn" onclick="openLogin()">Login</button><button class="btn btn-dark" onclick="showPage('sell')">+ SELL</button></div></div>
<div class="auth-bar" id="authBar"><span id="userStatus">Login karke ad lagao - Samundri | Gojra | Toba</span><button class="btn" id="logoutBtn" style="display:none" onclick="logout()">Logout</button></div>
<div class="search-bar"><input id="searchInput" placeholder="Find Cars, Mobile Phones and more..." oninput="doSearch()"><select id="citySelect" onchange="filterCity(this.value)" style="padding:12px;border:1px solid var(--dark);border-radius:6px"><option value="All">All Pakistan</option><option>Samundri</option><option>Gojra</option><option>Toba Tek Singh</option><option>Mureed Wala</option><option>Faisalabad</option></select></div>

<div class="page active" id="page-home">
<div class="cats" id="cats"></div>
<div style="padding:8px 12px;background:#fff;display:flex;gap:8px"><select id="sortPrice" onchange="sortAds()" style="padding:6px;border:1px solid var(--border);border-radius:6px;font-size:11px"><option value="">Sort: Recent</option><option value="low">Price Low to High</option><option value="high">Price High to Low</option></select><span style="font-size:11px;color:#6b7c80" id="count">0 Ads</span></div>
<div class="grid" id="grid"></div>
</div>

<div class="page" id="page-sell">
<div class="form">
<h2>Post Your Ad</h2>
<p id="needLogin" style="color:red;font-size:12px;display:none">Login required!</p>
<label>Category *</label><select id="sCat"><option>Mobiles</option><option>Vehicles</option><option>Property for Sale</option><option>Property for Rent</option><option>Bikes</option><option>Electronics</option><option>Home & Living</option><option>Fashion</option><option>Jobs</option><option>Services</option><option>Animals</option><option>Kids</option></select>
<label>City *</label><select id="sCity"><option>Samundri</option><option>Gojra</option><option>Toba Tek Singh</option><option>Mureed Wala</option><option>Faisalabad</option></select>
<label>Title *</label><input id="sTitle" placeholder="e.g. iPhone 14 Pro Max 256GB PTA">
<label>Description *</label><textarea id="sDesc" placeholder="Condition, features, reason for selling..."></textarea>
<label>Price Rs *</label><input id="sPrice" type="number" placeholder="285000">
<label>Your Name *</label><input id="sName" placeholder="Atiq">
<label>Phone Number *</label><input id="sPhone" placeholder="0300xxxxxxx">
<label>Image URL (or leave default)</label><input id="sImg" placeholder="https://...">
<button class="submit" onclick="postAd()">Post Now - Free</button>
</div>
</div>

<div class="page" id="page-myads">
<div style="max-width:700px;margin:0 auto;padding:12px"><h2>My Ads</h2><div id="myAds"></div></div>
</div>

<div class="page" id="page-fav">
<div style="max-width:700px;margin:0 auto;padding:12px"><h2>Favorites ❤️</h2><div id="favGrid" class="grid"></div></div>
</div>

<div class="page" id="page-chat">
<div style="max-width:700px;margin:0 auto;padding:12px"><h2>Chats</h2><div id="chatList" class="chat-list"></div></div>
</div>

<div class="page" id="page-detail">
<div style="max-width:700px;margin:0 auto;background:#fff;min-height:100vh"><img id="dImg" class="detail-img"><div class="detail-body"><div id="dPrice" style="font-weight:800;font-size:20px"></div><div id="dTitle" style="font-size:16px;margin:8px 0"></div><div id="dMeta" style="font-size:12px;color:#6b7c80"></div><p id="dDesc" style="margin:12px 0;font-size:13px;line-height:1.5"></p><div style="display:flex;gap:8px;margin-top:12px"><button class="submit" style="flex:1" onclick="startChat()">Chat with Seller</button><button class="btn" style="flex:1" id="dCall">Call</button></div><button class="btn" style="width:100%;margin-top:10px" onclick="showPage('home')">← Back</button></div></div>
</div>

<div class="modal" id="loginModal"><div class="box"><h2>Login / Sign Up</h2><p style="font-size:11px;color:#6b7c80;margin:6px 0">OLX jaisa account banao</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ chars)"><button class="submit" onclick="doLogin()">Login</button><button class="submit" style="background:#fff;color:var(--dark);border:1px solid var(--border);margin-top:8px" onclick="doSignup()">Create Account</button><button class="btn" style="width:100%;margin-top:8px;background:none;border:none" onclick="closeLogin()">Cancel</button><p id="loginMsg" style="font-size:12px;color:red;margin-top:6px"></p></div></div>

<div class="bottom-nav">
<button class="nav active" onclick="showPage('home')">🏠<br>HOME</button>
<button class="nav" onclick="showPage('fav')">❤️<br>FAV</button>
<button class="nav" onclick="showPage('sell')"><div class="sell-fab">+</div>SELL</button>
<button class="nav" onclick="showPage('chat')">💬<br>CHAT</button>
<button class="nav" onclick="showPage('myads')">👤<br>MY ADS</button>
</div>

<script>
const CATS=["All","Mobiles","Vehicles","Property for Sale","Property for Rent","Bikes","Electronics","Home & Living","Fashion","Jobs","Services","Animals","Kids"];
let sampleAds=[
{title:"iPhone 14 Pro Max PTA 256GB",price:285000,city:"Gojra",cat:"Mobiles",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400",desc:"PTA Approved, 10/10 condition",name:"Atiq",phone:"03430864009",user:"demo"},
{title:"Honda CD 70 2024 Model Zero Meter",price:158000,city:"Samundri",cat:"Bikes",img:"https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=400",desc:"Zero meter, documents clear",name:"Bilal",phone:"03001234567",user:"demo"},
{title:"5 Marla House Double Story Faisalabad",price:4500000,city:"Faisalabad",cat:"Property for Sale",img:"https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=400",desc:"5 Marla house for sale, prime location",name:"Owner",phone:"03211234567",user:"demo"},
{title:"Toyota Corolla GLI 2019",price:5200000,city:"Toba Tek Singh",cat:"Vehicles",img:"https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=400",desc:"Total genuine, Islamabad number",name:"Ali",phone:"03011223344",user:"demo"}
];
let ads=JSON.parse(localStorage.getItem('sm_all_ads')||'null')||sampleAds;
let favs=JSON.parse(localStorage.getItem('sm_fav')||'[]');
let chats=JSON.parse(localStorage.getItem('sm_chats')||'[]');
let currentFilter="All"; let currentCity="All";
function initCats(){let c=document.getElementById('cats');c.innerHTML=CATS.map((x,i)=>`<div class="chip ${i==0?'active':''}" onclick="setCat('${x}',this)">${x}</div>`).join('')}
function setCat(cat,el){currentFilter=cat;document.querySelectorAll('.chip').forEach(ch=>ch.classList.remove('active'));el.classList.add('active');apply()}
function filterCity(city){currentCity=city;apply()}
function apply(){let list=ads;if(currentFilter!="All")list=list.filter(a=>a.cat==currentFilter);if(currentCity!="All")list=list.filter(a=>a.city==currentCity);render(list)}
function render(list){let g=document.getElementById('grid');g.innerHTML='';document.getElementById('count').innerText=list.length+' Ads';list.forEach((ad,i)=>{let isFav=favs.includes(ad.title);g.innerHTML+=`<div class="card"><div class="heart" onclick="toggleFav('${ad.title}')">${isFav?'❤️':'🤍'}</div><img src="${ad.img}" onclick="openDetail(${ads.indexOf(ad)})"><div class="card-body" onclick="openDetail(${ads.indexOf(ad)})"><div class="price">Rs ${Number(ad.price).toLocaleString()}</div><div class="title">${ad.title}</div><div class="meta">${ad.city} • ${new Date().toLocaleDateString()}</div></div></div>`})}
function doSearch(){let q=document.getElementById('searchInput').value.toLowerCase();render(ads.filter(a=>a.title.toLowerCase().includes(q)||a.desc.toLowerCase().includes(q)))}
function sortAds(){let v=document.getElementById('sortPrice').value;let list=[...ads];if(v=='low')list.sort((a,b)=>a.price-b.price);if(v=='high')list.sort((a,b)=>b.price-a.price);render(list)}
function openDetail(idx){let ad=ads[idx];document.getElementById('dImg').src=ad.img;document.getElementById('dPrice').innerText='Rs '+Number(ad.price).toLocaleString();document.getElementById('dTitle').innerText=ad.title;document.getElementById('dMeta').innerText=ad.city+' • '+ad.cat+' • '+ad.name;document.getElementById('dDesc').innerText=ad.desc+'\n\nSeller: '+ad.name+'\nPhone: '+ad.phone;document.getElementById('dCall').innerText='Call '+ad.phone;document.getElementById('dCall').onclick=()=>window.open('tel:'+ad.phone);window._currentAd=ad;showPage('detail')}
function toggleFav(title){if(!localStorage.getItem('sm_current')){openLogin();return}if(favs.includes(title))favs=favs.filter(f=>f!=title);else favs.push(title);localStorage.setItem('sm_fav',JSON.stringify(favs));apply();renderFav()}
function renderFav(){let g=document.getElementById('favGrid');let list=ads.filter(a=>favs.includes(a.title));g.innerHTML='';if(!list.length)g.innerHTML='<p style="padding:20px">No favorites yet</p>';else list.forEach(ad=>{g.innerHTML+=`<div class="card"><img src="${ad.img}"><div class="card-body"><div class="price">Rs ${ad.price}</div><div class="title">${ad.title}</div></div></div>`})}
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.querySelectorAll('.bottom-nav .nav').forEach(n=>n.classList.remove('active'));if(p=='myads')renderMyAds();if(p=='fav')renderFav();if(p=='chat')renderChats();window.scrollTo(0,0)}
function openLogin(){document.getElementById('loginModal').classList.add('open')}
function closeLogin(){document.getElementById('loginModal').classList.remove('open')}
function doSignup(){let e=email.value.trim(),pw=password.value;if(!e||pw.length<6){loginMsg.innerText='Email sahi aur password 6+';return}let users=JSON.parse(localStorage.getItem('sm_users')||'[]');if(users.find(u=>u.email==e)){loginMsg.innerText='Already exists, login karo';return}users.push({email:e,password:pw});localStorage.setItem('sm_users',JSON.stringify(users));localStorage.setItem('sm_current',e);closeLogin();checkAuth();alert('Account ban gaya!')}
function doLogin(){let e=email.value.trim(),pw=password.value;let users=JSON.parse(localStorage.getItem('sm_users')||'[]');let u=users.find(u=>u.email==e&&u.password==pw);if(u){localStorage.setItem('sm_current',e);closeLogin();checkAuth()}else loginMsg.innerText='Galat email/password'}
function checkAuth(){let cur=localStorage.getItem('sm_current');if(cur){document.getElementById('userStatus').innerText='Welcome '+cur;document.getElementById('logoutBtn').style.display='block'}else{document.getElementById('userStatus').innerText='Login karke ad lagao - Samundri | Gojra | Toba';document.getElementById('logoutBtn').style.display='none'}}
function logout(){localStorage.removeItem('sm_current');location.reload()}
function postAd(){let cur=localStorage.getItem('sm_current');if(!cur){document.getElementById('needLogin').style.display='block';openLogin();return}let t=sTitle.value,pr=Number(sPrice.value),city=sCity.value,cat=sCat.value,desc=sDesc.value,name=sName.value,phone=sPhone.value,img=sImg.value||"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400";if(!t||!pr||!name||!phone){alert('Saare fields bharo');return}let newAd={title:t,price:pr,city:city,cat:cat,desc:desc,name:name,phone:phone,img:img,user:cur};ads.unshift(newAd);localStorage.setItem('sm_all_ads',JSON.stringify(ads));alert('Ad Posted! Home pe dekho');showPage('home');apply();sTitle.value='';sPrice.value='';sDesc.value=''}
function renderMyAds(){let cur=localStorage.getItem('sm_current');let div=document.getElementById('myAds');if(!cur){div.innerHTML='<p>Login karo taake apne ads dekho</p><button class="btn btn-dark" onclick="openLogin()">Login</button>';return}let list=ads.filter(a=>a.user==cur);if(!list.length){div.innerHTML='<p>Abhi koi ad nahi lagaya</p>';return}div.innerHTML='';list.forEach(ad=>{div.innerHTML+=`<div style="background:#fff;border:1px solid #ddd;padding:10px;border-radius:8px;margin-bottom:8px;display:flex;gap:10px"><img src="${ad.img}" style="width:80px;height:60px;object-fit:cover;border-radius:6px"><div><b style="font-size:13px">${ad.title}</b><div>Rs ${ad.price}</div><div style="font-size:10px;color:gray">${ad.city} • ${ad.cat}</div></div></div>`})}
function startChat(){let cur=localStorage.getItem('sm_current');if(!cur){openLogin();return}let ad=window._currentAd;chats.push({ad:ad.title,seller:ad.name,buyer:cur,time:new Date().toLocaleString()});localStorage.setItem('sm_chats',JSON.stringify(chats));alert('Chat started with '+ad.name);showPage('chat')}
function renderChats(){let cur=localStorage.getItem('sm_current');let div=document.getElementById('chatList');if(!cur){div.innerHTML='<p>Login karke chats dekho</p>';return}let list=chats.filter(c=>c.buyer==cur);if(!list.length){div.innerHTML='<p>No chats yet. Kisi ad pe Chat dabao</p>';return}div.innerHTML='';list.forEach(c=>{div.innerHTML+=`<div class="chat-item"><div><b>${c.ad}</b><div style="font-size:11px;color:gray">Seller: ${c.seller} • ${c.time}</div></div><button class="btn" onclick="alert('Chat feature: ${c.seller} se baat karo - ${c.ad}')">Open</button></div>`})}
initCats();checkAuth();apply();
</script>
</body>
</html>
