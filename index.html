<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Market - Samundri OLX</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header{background:#002f34;color:white;padding:10px;display:flex;align-items:center;gap:10px}
header img{width:45px;height:45px;border-radius:8px;object-fit:cover;background:white}
header h1{margin:0;font-size:22px}
.post-box{background:white;padding:15px;margin:10px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.post-box input,.post-box textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:5px;box-sizing:border-box}
.post-box button{background:#002f34;color:white;padding:12px;width:100%;border:none;border-radius:5px;font-size:16px;cursor:pointer}
#ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px}
.ad{background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:8px}
.ad h3{margin:5px 0;font-size:15px}
.ad p{margin:2px 0;color:#555;font-size:13px}
.ad .price{color:#002f34;font-weight:bold}
</style>
</head>
<body>
<header>
<img src="logopng.jpg" alt="SM Logo">
<h1>SM Market</h1>
</header>

<div class="post-box">
<h3>Apna Ad Post Karo</h3>
<input id="title" placeholder="Title - jaise iPhone 12 for sale">
<input id="price" placeholder="Price - jaise 50000">
<input id="location" placeholder="Location - jaise Samundri">
<input id="phone" placeholder="WhatsApp Number">
<textarea id="desc" placeholder="Details likho"></textarea>
<button id="postBtn">POST AD - Sab ko dikhega</button>
<p id="msg"></p>
</div>

<div id="ads">Loading ads...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCL9suGZQzEI-VnAWECeQVZDlZOOS7Ni30",
  authDomain: "sm-market-f7283.firebaseapp.com",
  projectId: "sm-market-f7283",
  storageBucket: "sm-market-f7283.firebasestorage.app",
  messagingSenderId: "467902826161",
  appId: "1:467902826161:web:69a2a4f1c9ef47bf050490",
  measurementId: "G-P0T153SZ4Q"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const adsDiv = document.getElementById('ads');
const postBtn = document.getElementById('postBtn');

async function loadAds(){
  adsDiv.innerHTML = "Loading...";
  try{
    const q = query(collection(db, "ads"), orderBy("time","desc"));
    const snap = await getDocs(q);
    adsDiv.innerHTML = "";
    if(snap.empty){ adsDiv.innerHTML = "<p style='padding:10px'>Abhi koi ad nahi hai, pehla ad aap post karo!</p>"; return;}
    snap.forEach(doc=>{
      const d = doc.data();
      const div = document.createElement('div');
      div.className = 'ad';
      div.innerHTML = `<h3>${d.title}</h3><p class='price'>Rs ${d.price}</p><p>${d.location||''}</p><p>${d.desc||''}</p><p>📞 ${d.phone||''}</p>`;
      adsDiv.appendChild(div);
    });
  }catch(e){ adsDiv.innerHTML = "Error: "+e.message+"<br>Firestore Rules check karo"; }
}
loadAds();

postBtn.onclick = async ()=>{
  const title = document.getElementById('title').value.trim();
  const price = document.getElementById('price').value.trim();
  const location = document.getElementById('location').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const desc = document.getElementById('desc').value.trim();
  if(!title || !price){ alert("Title aur Price likho"); return; }
  postBtn.innerText = "Posting...";
  try{
    await addDoc(collection(db,"ads"),{title,price,location,phone,desc,time:serverTimestamp()});
    document.getElementById('msg').innerText = "✅ Ad Post ho gaya! Sab ko dikhega!";
    document.getElementById('title').value="";document.getElementById('price').value="";document.getElementById('desc').value="";
    loadAds();
  }catch(e){ alert("Error: "+e.message); }
  postBtn.innerText = "POST AD - Sab ko dikhega";
};
</script>
</body>
</html>
