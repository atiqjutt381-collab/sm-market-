<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f7f8;padding-bottom:80px}
.header{background:#0f2f33;color:white;padding:10px 12px}
.header-top{display:flex;align-items:center;gap:10px}
.logo-icon{width:44px;height:44px;background:white;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.logo-icon::after{content:'';position:absolute;bottom:0;right:0;width:50%;height:100%;background:#2f80ff;clip-path:polygon(30% 0,100% 0,100% 100%,0 100%)}
.logo-icon svg{z-index:1}
.header h1{font-size:18px;font-weight:800}
.header h1 span.blue{color:#2f80ff}
.cities{font-size:12px;display:flex;align-items:center;gap:4px;margin-top:4px;opacity:0.9}
.search-wrap{background:white;padding:10px 12px;display:flex;gap:0;border-bottom:1px solid #d8dfe0}
.input-wrap{flex:1;position:relative}
.input-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#6b7c80}
.search-wrap input{width:100%;padding:12px 14px 12px 38px;border:1px solid #d8dfe0;border-radius:8px 0 0 8px;font-size:14px;outline:none}
.search-btn{background:#0f2f33;color:white;border:none;padding:0 20px;border-radius:0 8px 8px 0;font-weight:700;cursor:pointer}
.cat-bar,.city-bar{padding:10px 12px;background:white;display:flex;gap:8px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #d8dfe0}
.chip{padding:8px 16px;border-radius:20px;border:1px solid #d8dfe0;background:white;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;flex-shrink:0}
.chip.active{background:#0f2f33;color:white;border-color:#0f2f33}
.city-bar{background:#eef2f3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;background:#f5f7f8}
.card{background:white;border-radius:12px;overflow:hidden;border:1px solid #d8dfe0;position:relative;cursor:pointer}
.card img{width:100%;height:170px;object-fit:cover;background:#ddd}
