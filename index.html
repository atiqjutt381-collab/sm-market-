<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Faisalabad Market - 46 Cities</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f5f5;padding-bottom:85px}
.header{background:#2563eb;color:white;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.logo-circle{width:42px;height:42px;background:white;color:#2563eb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.header-text{line-height:1.1}
.header-text b{font-size:14px}
.header-text span{background:white;color:#2563eb;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;margin-left:6px}
.red-dot{background:red;color:white;border-radius:50%;padding:2px 7px;font-size:12px;font-weight:900;margin-left:auto}
.search-bar{padding:10px;background:white;display:flex;gap:8px;position:sticky;top:60px;z-index:90}
.search-bar input{flex:1;padding:11px;border:1px solid #ddd;border-radius:12px}
.chips{display:flex;gap:6px;overflow:auto;padding:8px;background:white}
.chip{white-space:nowrap;padding:6px 12px;border-radius:20px;background:#eee;font-size:12px;cursor:pointer}
.chip.active{background:#2563eb;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card img{width:100%;height:150px;object-fit:cover}
.card-body{padding:8px}
.price{font-weight:900;color:#2563eb;font-size:14px}
.title{font-size:13px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.city{font-size:11px;color:gray}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:100}
.nav-item{text-align:center;font-size:11px;cursor:pointer;color:#666}
.nav-item.active{color:#2563eb;font-weight:800}
.nav-circle{width:34px;height:34px;background:#eee;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 3px;font-size:18px}
.nav-item.active .nav-circle{background:#2563eb;color:white}
.page{display:none;padding:12px}
.page.active{display:block}
.plan{border:2px solid #ddd;padding:12px;border-radius:12px;margin:8px 0;cursor:pointer;background:white}
.plan.selected{border-color:#2563eb;background:#eef2ff}
</style>
</head>
<body>
<div class="header">
<div class="logo-circle">SM</div>
<div class="header-text"><b>SM FAISALABAD MARKET</b><br><span>46 Cities</span></div>
<div class="red-dot" id="pendingCount" style="display:none">0</div>
<div style="margin-left:8px;display:flex;gap:6px;align-items:center">
<button id="loginBtn" onclick="openLogin()" style="background:white;color:#2563eb;border:none;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px">Login</button>
<span id="userName" style="display:none;font-size:11px;font-weight:900"></span>
<button id="logoutBtn" onclick="logout()" style="display:none;background:#ff3b30;color:white;border:none;padding:5px 8px;border-radius:20px;font-size:10px">Logout</button>
</div>
</div>
<div class="search-bar"><input id="search" placeholder="Search..." oninput="renderHome()"></div>
<div class="chips" id="catChips"></div>
<div id="homePage" class="page active"><div id="homeGrid" class="grid"></div></div>
<div id="myAdsPage" class="page">
<h3>My Ads</h3>
<input id="adTitle" placeholder="Title" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0">
<input id="adPrice" placeholder="Price" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0">
<select id="adCity" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0"><option>Faisalabad</option><option>Samundri</option><option>Gojra</option><option>Toba Tek Singh</option></select>
<select id="adCat" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0"><option>Mobiles</option><option>Cars</option><option>Property</option><option>Bikes</option><option>Electronics</option></select>
<textarea id="adDesc" placeholder="Description" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0"></textarea>
<input id="adPhone" placeholder="WhatsApp 03XXXXXXXXX" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0">
<input id="adImg" placeholder="Image URL" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0">
<div class="plan selected" onclick="selPlan(this,'FREE')"><b>FREE - Rs 0</b></div>
<div class="plan" onclick="selPlan(this,'14D')"><b>14 Days - Rs 499</b></div>
<div class="plan" onclick="selPlan(this,'30D')"><b>30 Days - Rs 999</b></div>
<div id="payBox" style="display:none;background:#fff3e0;padding:12px;border-radius:10px;margin:8px 0"><b>Easypaisa: 03430864009 - Atiq</b><br><small>Screenshot lazmi</small><br><input id="payShot" type="file" accept="image/*"></div>
<button onclick="postAd()" style="width:100%;background:#2563eb;color:white;padding:14px;border:none;border-radius:12px;font-weight:900;margin-top:10px">Post Ad</button>
<div id="myAdsList" style="margin-top:15px"></div>
</div>
<div id="adminPage" class="page"><h3>Admin</h3><div id="adminList"></div></div>
<div id="chatsPage" class="page"><h3>Chats</h3></div>
<div class="bottom-nav">
<div class="nav-item active" onclick="showPage('homePage',this)"><div class="nav-circle">🏠</div>Home</div>
<div class="nav-item" onclick="showPage('myAdsPage',this)"><div class="nav-circle">➕</div>My Ads</div>
<div class="nav-item" onclick="showPage('adminPage',this)"><div class="nav-circle">🛡️</div>Admin</div>
<div class="nav-item" onclick="showPage('chatsPage',this)"><div class="nav-circle">💬</div>Chats</div>
</div>
<div id="adDetail" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;padding:15px;overflow:auto"><div style="background:white;border-radius:18px;max-width:420px;margin:20px auto;overflow:hidden"><img id="dImg" style="width:100%;height:320px;object-fit:cover"><div style="padding:15px"><div id="dPrice" style="font-weight:900;font-size:24px;color:#2563eb"></div><div id="dTitle" style="font-size:18px;margin:6px 0;font-weight:700"></div><div id="dCity" style="color:gray"></div><div id="dDesc" style="margin:12px 0;background:#f5f5f5;padding:12px;border-radius:10px"></div><a id="dChat" href="#" target="_blank" style="display:block;background:#25D366;color:white;text-align:center;padding:14px;border-radius:12px;font-weight:900;text-decoration:none">WhatsApp Chat</a><button onclick="document.getElementById('adDetail').style.display='none'" style="width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #ddd">Close</button></div></div></div>
<div id="loginBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:10000;padding:15px"><div style="background:white;border-radius:18px;max-width:360px;margin:40px auto;padding:22px"><h3 style="text-align:center">Login</h3><div id="signupFields" style="display:none"><input id="sName" placeholder="Naam" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0"><input id="sCity" placeholder="City" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0"></div><input id="lEmail" placeholder="Mobile 03XXXXXXXXX" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0"><input id="lPass" type="password" placeholder="Password" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0"><button id="authBtn" onclick="handleAuth()" style="width:100%;background:#2563eb;color:white;padding:12px;border:none;border-radius:10px;font-weight:900">Login</button><div style="font-size:12px;text-align:center;margin-top:10px"><span id="toggleText">Account nahi hai?</span> <span style="color:#2563eb;font-weight:800;cursor:pointer" onclick="toggleMode()">Signup</span></div><button onclick="document.getElementById('loginBox').style.display='none'" style="width:100%;background:#eee;padding:10px;border:none;border-radius:10px;margin-top:10px">Close</button><div id="msg" style="color:red;font-size:12px;text-align:center;margin-top:8px"></div></div></div>
<button id="installBtn" style="display:none;position:fixed;bottom:85px;right:15px;background:#25D366;color:white;border:none;padding:12px 18px;border-radius:25px;font-weight:900;z-index:9999">App Install</button>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, query, orderBy, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCL9suGZQzEI-VnAWECeQVZDlZOOS7Ni30",
  authDomain: "sm-market-f7283.firebaseapp.com",
  projectId: "sm-market-f7283",
  storageBucket: "sm-market-f7283.firebasestorage.app",
  messagingSenderId: "467902826161",
  appId: "1:467902826161:web:69a2a4f1c9ef47bf050490",
  measurementId: "G-P0T153SZ4Q"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let ads=[];let curCat='All';let selPlanType='FREE';let isSignup=false;
const cats=['All','Mobiles','Cars','Property','Bikes','Electronics'];
function initChips(){const c=document.getElementById('catChips');c.innerHTML=cats.map(cat=>`<div class="chip ${cat===curCat?'active':''}" onclick="setCat('${cat}')">${cat}</div>`).join('');}
window.setCat=(cat)=>{curCat=cat;initChips();renderHome();}
onSnapshot(query(collection(db,"ads"),orderBy("time","desc")),(snap)=>{ads=[];snap.forEach(d=>{ads.push({id:d.id,...d.data()});});renderHome();renderMyAds();renderAdmin();const p=ads.filter(a=>a.status!=='APPROVED').length;const el=document.getElementById('pendingCount');el.innerText=p;el.style.display=p>0?'block':'none';});
window.renderHome=()=>{const grid=document.getElementById('homeGrid');let list=ads.filter(a=>a.status==='APPROVED');if(curCat!=='All') list=list.filter(a=>a.cat===curCat);const s=(document.getElementById('search').value||'').toLowerCase();if(s) list=list.filter(a=>(a.title||'').toLowerCase().includes(s));if(list.length===0){grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:gray;padding:30px">Koi Ad nahi</p>';return;}grid.innerHTML=list.map(a=>`<div class="card" onclick="openAd('${a.id}')"><img src="${a.img||'https://via.placeholder.com/300'}"><div class="card-body"><div class="price">Rs ${a.price}</div><div class="title">${a.title}</div><div class="city">${a.location||''} ${a.plan!=='FREE'?'⭐':''}</div></div></div>`).join('');}
window.openAd=(id)=>{const a=ads.find(x=>x.id===id);if(!a) return;document.getElementById('dImg').src=a.img||'https://via.placeholder.com/300';document.getElementById('dPrice').innerText='Rs '+a.price;document.getElementById('dTitle').innerText=a.title;document.getElementById('dCity').innerText=(a.location||'')+' - '+(a.cat||'');document.getElementById('dDesc').innerText=a.desc||'';const phone=(a.phone||'923430864009').toString().replace(/[^0-9]/g,'');document.getElementById('dChat').href='https://wa.me/'+phone+'?text=Salam '+encodeURIComponent(a.title);document.getElementById('adDetail').style.display='block';}
window.selPlan=(el,type)=>{document.querySelectorAll('.plan').forEach(p=>p.classList.remove('selected'));el.classList.add('selected');selPlanType=type;document.getElementById('payBox').style.display=(type==='FREE')?'none':'block';}
window.postAd=async()=>{const title=document.getElementById('adTitle').value.trim();const price=document.getElementById('adPrice').value.trim();const city=document.getElementById('adCity').value;const cat=document.getElementById('adCat').value;const desc=document.getElementById('adDesc').value.trim();const phone=document.getElementById('adPhone').value.trim();const img=document.getElementById('adImg').value.trim()||'https://via.placeholder.com/300';const shot=document.getElementById('payShot').files[0];if(!title||!price){alert('Title Price likho');return;}if(selPlanType!=='FREE'&&!shot){alert('Paid ke liye screenshot lazmi 03430864009');return;}const status=(selPlanType==='FREE')?'APPROVED':'PENDING_PAYMENT';await addDoc(collection(db,'ads'),{title,price,location:city,cat,desc,phone,img,status,plan:selPlanType,time:serverTimestamp(),uid:auth.currentUser?.uid||'guest',paymentShot:shot?shot.name:'none'});alert(selPlanType==='FREE'?'Ad Post Ho Gaya':'Pending - Admin check karega');}
window.renderMyAds=()=>{const my=auth.currentUser?ads.filter(a=>a.uid===auth.currentUser.uid):[];document.getElementById('myAdsList').innerHTML=my.map(a=>`<div style="background:white;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between"><span>${a.title} - ${a.plan}</span><span style="color:${a.status==='APPROVED'?'green':'orange'}">${a.status}</span></div>`).join('');}
window.renderAdmin=()=>{const list=document.getElementById('adminList');list.innerHTML=ads.map(a=>`<div style="background:white;padding:12px;border-radius:10px;margin:8px 0"><b>${a.title}</b> - Rs ${a.price} - ${a.plan} - ${a.paymentShot||''}<br><span style="font-weight:900;color:${a.status==='APPROVED'?'green':'red'}">${a.status}</span><div style="margin-top:8px;display:flex;gap:6px"><button onclick="updateStatus('${a.id}','APPROVED')" style="background:green;color:white;border:none;padding:7px 12px;border-radius:6px">Approve</button><button onclick="updateStatus('${a.id}','REJECTED')" style="background:red;color:white;border:none;padding:7px 12px;border-radius:6px">Reject</button><button onclick="deleteAd('${a.id}')" style="background:#333;color:white;border:none;padding:7px 12px;border-radius:6px">Delete</button></div></div>`).join('');}
window.updateStatus=async(id,status)=>{await updateDoc(doc(db,'ads',id),{status});}
window.deleteAd=async(id)=>{if(confirm('Delete?')) await deleteDoc(doc(db,'ads',id));}
window.openLogin=()=>{document.getElementById('loginBox').style.display='block';}
window.toggleMode=()=>{isSignup=!isSignup;document.getElementById('signupFields').style.display=isSignup?'block':'none';document.getElementById('authBtn').innerText=isSignup?'Signup':'Login';}
window.handleAuth=async()=>{const phone=document.getElementById('lEmail').value.trim();const pass=document.getElementById('lPass').value.trim();const msg=document.getElementById('msg');if(phone.length<10||pass.length<4){msg.innerText='Phone Password sahi likho';return;}const email=phone.replace(/[^0-9]/g,'')+'@smfaisalabad.com';msg.innerText='Wait...';try{if(isSignup){const name=document.getElementById('sName').value.trim()||'User';const city=document.getElementById('sCity').value.trim()||'Faisalabad';const cred=await createUserWithEmailAndPassword(auth,email,pass);await setDoc(doc(db,'users',cred.user.uid),{name,phone,city,created:new Date().toISOString()});}else{await signInWithEmailAndPassword(auth,email,pass);}document.getElementById('loginBox').style.display='none';msg.innerText='';}catch(e){msg.innerText=e.message;}}
onAuthStateChanged(auth,async(user)=>{const lb=document.getElementById('loginBtn');const un=document.getElementById('userName');const lo=document.getElementById('logoutBtn');if(user){const snap=await getDoc(doc(db,'users',user.uid));const data=snap.exists()?snap.data():{name:user.email.split('@')[0]};lb.style.display='none';un.style.display='block';un.innerText=data.name;lo.style.display='block';renderMyAds();}else{lb.style.display='block';un.style.display='none';lo.style.display='none';}});
window.logout=async()=>{await signOut(auth);location.reload();}
window.showPage=(id,el)=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));if(el) el.classList.add('active');}
initChips();
let deferredPrompt;window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block';});
document.getElementById('installBtn').addEventListener('click',async()=>{if(!deferredPrompt){alert('Browser menu > Add to Home Screen');return;}deferredPrompt.prompt();const c=await deferredPrompt.userChoice;if(c.outcome==='accepted') alert('App Install Ho Raha Hai!');deferredPrompt=null;document.getElementById('installBtn').style.display='none';});
</script>
</body>
</html>
