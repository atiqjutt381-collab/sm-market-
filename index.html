<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SM Faisalabad Market - 46 Cities</title><style>:root{--d:#0a2e36;--y:#ffce32;--g:#10b981}*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}body{background:#f5f5f5}.top{background:var(--d);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20}.logo{font-weight:800}.logo span{color:var(--y)}.search{margin:10px;background:#fff;border-radius:10px;display:flex;padding:0 12px;border:1px solid #ddd}.search input{flex:1;border:none;padding:12px;outline:none}.chips,.cities{display:flex;gap:8px;overflow:auto;padding:8px 10px}.chip,.city{background:#fff;border:1px solid #ddd;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600}.chip.a,.city.a{background:var(--d);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.card{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #eee;position:relative}.card img{width:100%;height:140px;object-fit:cover}.badge{position:absolute;top:6px;left:6px;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:800;color:#fff}.free{background:var(--g)}.feat{background:#f59e0b}.pending{background:#ef4444}.card-body{padding:8px}.pr{font-weight:800;color:var(--d)}.de{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lo{font-size:10px;color:#666}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:6px 0;border-top:1px solid #ddd}.b{font-size:11px;text-align:center}.b.on{color:var(--d);font-weight:800}.page{display:none;padding-bottom:80px}.page.on{display:block}.sell{background:#fff;margin:10px;padding:14px;border-radius:12px;border:1px solid #e5e7eb}.f{margin-bottom:10px}.f label{font-size:12px;font-weight:700;display:block}.f input,.f select,.f textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px}.bt{background:var(--d);color:#fff;border:none;padding:12px;width:100%;border-radius:10px;font-weight:800;margin-top:8px}.plan{border:1px solid #ddd;padding:10px;border-radius:10px;margin-bottom:8px}.plan.on{border:2px solid var(--d);background:#f0fdf4}.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;padding:14px}.ov.show{display:block}.bx{background:#fff;border-radius:14px;padding:14px;max-height:90vh;overflow:auto}.easy{background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:10px;margin:10px 0}.num{font-size:22px;font-weight:800;color:var(--d)}</style></head><body>
<div class=top><div class=logo>SM <span>Faisalabad Market</span> <small style=font-size:10px;background:var(--y);color:#000;padding:2px 6px;border-radius:10px>46 Cities</small></div><div onclick=openAdmin()>🔴</div></div>

<div id=chatsPage class=page><div style=padding:10px><h3>Chats <span id=chatCount>0</span></h3><div id=chatList></div><div id=chatThread style=display:none;background:#fff;border-radius:12px;border:1px solid #ddd;margin-top:10px><div style=padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between><b id=threadTitle>Chat</b><span onclick=backToChats()>✕</span></div><div id=threadMsgs style=height:300px;overflow:auto;padding:10px;background:#f9fafb></div><div style=display:flex;gap:6px;padding:8px><input id=chatInput style=flex:1;padding:10px;border:1px solid #ddd;border-radius:8px><button onclick=sendReply() style=background:#0a2e36;color:#fff;border:none;padding:10px 14px;border-radius:8px>Send</button></div></div></div></div>
<div id=myAdsPage class=page><div style=padding:10px><h3>My Ads & Plans</h3><div id=myAdsList></div><div style=margin-top:14px;background:#fff;border-radius:14px;padding:14px;border:1px solid #e5e7eb><h4>Sell Fast Now</h4><div class=plan on id=planFree onclick=selectPlan('free')><b>FREE - 0 Rs</b></div><div class=plan id=plan499 onclick=selectPlan('499')><b>⭐ Featured 499 - 14 Days</b></div><div class=plan id=plan999 onclick=selectPlan('999')><b>🚀 Premium 999 - 30 Days</b></div><div class=easy id=easyBox style=display:none><div style=font-weight:800;color:#dc2626>Payment LAZMI</div><div class=num>03430864009</div><div class=f><label>Screenshot Upload *</label><input type=file id=payShot accept=image/* onchange=previewPay(event)><div id=payPrev></div></div></div><button class=bt onclick=applyPlan()>Apply Plan</button></div></div></div>

<div class=bottom><div class="b on" onclick=showPage('homePage') id=bHome>🏠<br>Home</div><div class=b onclick=showPage('chatsPage') id=bChat>💬<br>Chats</div><div class=b onclick=showPage('sellPage') id=bSell><div style=background:#0a2e36;color:#fff;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;margin:0 auto>+</div>Sell</div><div class=b onclick=showPage('myAdsPage') id=bMy>👤<br>My Ads</div></div>
<div class=ov id=adminOv><div class=bx><h3>Admin atiq123</h3><div class=f><input id=adminPass type=password value=atiq123></div><button class=bt onclick=checkAdmin()>Login</button><button class=bt onclick=document.getElementById('adminOv').classList.remove('show')>Close</button><div id=adminList></div></div></div>
<script>let ads=JSON.parse(localStorage.getItem('sm_ads_v46')||'[]');let chats=JSON.parse(localStorage.getItem('sm_chats_v46')||'[]');const CAT_ICONS={"All":"🌐 All","Mobiles":"📱 Mobiles","Cars":"🚗 Cars","Property for Sale":"🏠 Property","Property for Rent":"🏘️ Rent","Motorcycles":"🏍️ Bikes","Electronics":"💻 Electronics","Furniture & Home Decor":"🛋️ Furniture","Fashion & Beauty":"👕 Fashion","Jobs":"💼 Jobs","Services":"🔧 Services","Business, Industry & Agriculture":"🏭 Business","Animals":"🐄 Animals","Kids":"🧸 Kids","Books, Sports & Hobbies":"📚 Books"};const CATS=Object.keys(CAT_ICONS);const CITIES=["All","Samundri","Gojra","Toba Tek Singh","Faisalabad","Mureed Wala","Tandlianwala","Jaranwala","Kamalia","Pir Mahal","Mamunkanjan","Sahiwal","Okara","Jhang","Chiniot","Sargodha","Sheikhupura","Lahore","Multan","Burewala","Vehari","Bahawalpur","Karachi","Islamabad","Gujranwala","Sialkot","Gujrat","Jhelum","Kasur","Chak Jhumra","Dijkot","Khurrianwala","Nankana Sahib","Shahkot","Sangla Hill","Satiana","Hafizabad","Narowal","Mandi Bahauddin","Pattoki","Chak 46","Chak 476","Chak 441","Chak 400","Chak 393"];if(ads.length==0){ads=[{id:'ad1',title:'iPhone 12 Pro Max PTA',price:'10000',city:'Samundri',cat:'Mobiles',phone:'03430864009',desc:'128GB',image:'https://picsum.photos/seed/iphone12/600/400',plan:'free',status:'live',featured:true,created:Date.now()},{id:'ad2',title:'Honda CD 70 2023',price:'85000',city:'Gojra',cat:'Motorcycles',phone:'03001234567',desc:'Good',image:'https://picsum.photos/seed/cd70/600/400',plan:'free',status:'live',featured:false,created:Date.now()-1000},{id:'ad3',title:'5 Marla House',price:'5000000',city:'Faisalabad',cat:'Property for Sale',phone:'03009876543',desc:'House',image:'https://picsum.photos/seed/house/600/400',plan:'free',status:'live',featured:false,created:Date.now()-2000}];localStorage.setItem('sm_ads_v46',JSON.stringify(ads))}let currentCat="All",currentCity="All",selectedPlan="free",selectedImageBase64="",payImageBase64="",openThreadId=null;function initCats(){document.getElementById("catSc").innerHTML=CATS.map(c=>`<div class="chip ${c==currentCat?'a':''}" onclick="filterCat('${c}')">${CAT_ICONS[c]}</div>`).join("");document.getElementById("citySc").innerHTML=CITIES.map(c=>`<div class="city ${c==currentCity?'a':''}" onclick="filterCity('${c}')">${c}</div>`).join("");document.getElementById("sellCat").innerHTML=CATS.filter(c=>c!="All").map(c=>`<option value="${c}">${CAT_ICONS[c]}</option>`).join("");document.getElementById("sellCity").innerHTML=CITIES.filter(c=>c!="All").map(c=>`<option>${c}</option>`).join("")}window.filterCat=c=>{currentCat=c;initCats();renderHome()};window.filterCity=c=>{currentCity=c;initCats();renderHome()};window.showPage=id=>{document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));document.getElementById(id).classList.add("on");document.querySelectorAll(".b").forEach(b=>b.classList.remove("on"));if(id=="homePage")document.getElementById("bHome").classList.add("on");if(id=="chatsPage")document.getElementById("bChat").classList.add("on");if(id=="sellPage")document.getElementById("bSell").classList.add("on");if(id=="myAdsPage")document.getElementById("bMy").classList.add("on");if(id=="myAdsPage")renderMyAds();if(id=="chatsPage")renderChatList()};window.selectPlan=p=>{selectedPlan=p;document.querySelectorAll(".plan").forEach(x=>x.classList.remove("on"));document.getElementById(p=="free"?"planFree":p=="499"?"plan499":"plan999").classList.add("on");document.getElementById("easyBox").style.display=p=="free"?"none":"block"};window.previewImage=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{selectedImageBase64=ev.target.result;document.getElementById("imgPrev").innerHTML=`<img src="${selectedImageBase64}" style=width:100%;height:140px;object-fit:cover;border-radius:8px><div style=color:green>✓ OK</div>`};r.readAsDataURL(f)};window.previewPay=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{payImageBase64=ev.target.result;document.getElementById("payPrev").innerHTML=`<img src="${payImageBase64}" style=width:100%;height:100px;object-fit:cover;border-radius:8px><small style=color:green>✓ Screenshot OK</small>`};r.readAsDataURL(f)};window.postAd=()=>{const t=document.getElementById("sellTitle").value.trim(),p=document.getElementById("sellPrice").value.trim(),c=document.getElementById("sellCity").value,ph=document.getElementById("sellPhone").value.trim(),d=document.getElementById("sellDesc").value.trim(),cat=document.getElementById("sellCat").value;if(!t||!p||!c||!ph){alert("Title Price Location Phone LAZMI");return}if(!selectedImageBase64){if(!confirm("Image nahi! Post?"))return}localStorage.setItem("sm_phone",ph);const n={id:'ad_'+Date.now(),title:t,price:p,city:c,phone:ph,desc:d,cat:cat,image:selectedImageBase64||`https://picsum.photos/seed/${Date.now()}/600/400`,plan:'free',status:'live',featured:false,created:Date.now()};ads.unshift(n);localStorage.setItem('sm_ads_v46',JSON.stringify(ads));alert("Ad LIVE Home pe");document.getElementById("sellTitle").value="";document.getElementById("sellPrice").value="";document.getElementById("sellDesc").value="";selectedImageBase64="";document.getElementById("imgPrev").innerHTML='📷 Choose Image';renderHome();showPage('homePage')};function renderHome(){const s=document.getElementById("search").value.toLowerCase();let f=[...ads];if(currentCat!="All")f=f.filter(a=>a.cat==currentCat);if(currentCity!="All")f=f.filter(a=>a.city==currentCity);if(s)f=f.filter(a=>(a.title+a.desc+a.city+a.cat).toLowerCase().includes(s));f.sort((a,b)=>{if(a.status=="pending"&&b.status!="pending")return 1;if(b.status=="pending"&&a.status!="pending")return-1;return(b.featured?1:0)-(a.featured?1:0)||b.created-a.created});document.getElementById("adCount").innerText=f.length+" Ads";document.getElementById("homeGrid").innerHTML=f.map(a=>{const b=a.status=="pending"?'<div class="badge pending">PENDING</div>':a.featured?'<div class="badge feat">FEATURED</div>':'<div class="badge free">FREE</div>';return `<div class=card onclick=openDetail('${a.id}')>${b}<img src="${a.image}" onerror="this.src='https://picsum.photos/seed/${a.id}/400/300'"><div class=card-body><div class=pr>Rs ${a.price}</div><div class=de>${a.title}</div><div class=lo>📍 ${a.city} • ${a.cat}</div></div></div>`}).join("")}window.renderHome=renderHome;window.openDetail=id=>{const a=ads.find(x=>x.id==id);if(!a)return;document.getElementById("detailContent").innerHTML=`<img src="${a.image}" style=width:100%;height:300px;object-fit:cover;border-radius:12px><h2>Rs ${a.price}</h2><h3>${a.title}</h3><p style=font-size:12px;color:#666>${a.cat} • ${a.city} • ${a.status}</p><p style=margin-top:10px;background:#f8fafc;padding:10px;border-radius:10px;border:1px solid #e5e7eb>${a.desc}</p><button class=bt onclick=startChat('${a.id}','${a.phone}')>💬 Chat</button><a href=https://wa.me/92${a.phone.replace(/^0/,'')} target=_blank style=display:block;text-align:center;margin-top:8px;background:#25D366;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:800>WhatsApp ${a.phone}</a>`;showPage('detailPage')};window.startChat=(adId,sellerPhone)=>{const bp=localStorage.getItem("sm_phone")||prompt("Apna WhatsApp:");if(!bp)return;localStorage.setItem("sm_phone",bp);const m=prompt("Message:");if(!m)return;const th=adId+"_"+sellerPhone+"_"+bp;const nc={id:'chat_'+Date.now(),adId,sellerPhone,buyerPhone:bp,message:m,time:Date.now(),thread:th};chats.unshift(nc);localStorage.setItem('sm_chats_v46',JSON.stringify(chats));alert("Sent!");renderChatList();showPage('chatsPage')};function renderChatList(){const my=localStorage.getItem("sm_phone")||"";let list=[...chats];if(my)list=chats.filter(c=>c.sellerPhone==my||c.buyerPhone==my);const th=[...new Map(list.map(c=>[c.thread,c])).values()];document.getElementById("chatCount").innerText=th.length;document.getElementById("chatList").innerHTML=th.map(t=>{const ad=ads.find(a=>a.id==t.adId);return `<div class=chat-item onclick=openThread('${t.thread}')><div style=width:40px;height:40px;background:#0a2e36;color:#fff;border-radius:50%;display:grid;place-items:center>💬</div><div style=flex:1><b>${ad?ad.title:'Ad Chat'}</b><br><small>${t.message.slice(0,40)}</small></div></div>`}).join("")||'<p style=text-align:center;color:#666;margin-top:20px>No chats</p>'}window.renderChatList=renderChatList;window.openThread=id=>{openThreadId=id;const ms=chats.filter(c=>c.thread==id).sort((a,b)=>a.time-b.time);if(ms.length==0)return;document.getElementById("chatThread").style.display="block";document.getElementById("threadTitle").innerText=ads.find(a=>a.id==ms[0].adId)?.title||"Chat";document.getElementById("threadMsgs").innerHTML=ms.map(m=>`<div style=background:${m.buyerPhone==localStorage.getItem("sm_phone")?'#dcf8c6':'#fff'};padding:8px 10px;border-radius:10px;margin-bottom:6px;max-width:80%;${m.buyerPhone==localStorage.getItem("sm_phone")?'margin-left:auto':''}>${m.message}</div>`).join("");document.getElementById("threadMsgs").scrollTop=document.getElementById("threadMsgs").scrollHeight};window.backToChats=()=>{document.getElementById("chatThread").style.display="none";openThreadId=null};window.sendReply=()=>{const txt=document.getElementById("chatInput").value.trim();if(!txt||!openThreadId)return;const last=chats.find(c=>c.thread==openThreadId);if(!last)return;const nc={id:'chat_'+Date.now(),adId:last.adId,sellerPhone:last.sellerPhone,buyerPhone:last.buyerPhone,message:txt,time:Date.now(),thread:openThreadId};chats.unshift(nc);localStorage.setItem('sm_chats_v46',JSON.stringify(chats));document.getElementById("chatInput").value="";openThread(openThreadId)};function renderMyAds(){const my=localStorage.getItem("sm_phone")||"";const mine=ads.filter(a=>a.phone==my);document.getElementById("myAdsList").innerHTML=mine.map(a=>`<div style=background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px;margin-bottom:6px;display:flex;gap:8px><img src="${a.image}" style=width:60px;height:60px;border-radius:6px;object-fit:cover><div style=flex:1><b>${a.title}</b> - Rs ${a.price}<br><small>${a.city} - ${a.status}</small></div></div>`).join("")||'<p style=font-size:13px;color:#666;background:#fff;padding:10px;border-radius:10px>No ads yet</p>'}window.applyPlan=()=>{const my=localStorage.getItem("sm_phone")||"";if(!my){alert("Pehle ad post karo");return}const mine=ads.filter(a=>a.phone==my);if(mine.length==0){alert("No ad");return}const ad=mine[0];if(selectedPlan!="free"){if(!payImageBase64){alert("Screenshot LAZMI 03430864009");return}ad.status="pending";ad.plan=selectedPlan;ad.payProof=payImageBase64;localStorage.setItem('sm_ads_v46',JSON.stringify(ads));alert("PENDING me gaya Admin approve karega")}else{ad.plan="free";ad.status="live";ad.featured=false;localStorage.setItem('sm_ads_v46',JSON.stringify(ads));alert("FREE applied")}renderHome();renderMyAds()};window.openAdmin=()=>{document.getElementById("adminOv").classList.add("show");document.getElementById("adminList").innerHTML="<p>Password atiq123</p>"};window.checkAdmin=()=>{const p=document.getElementById("adminPass").value;if(p!="atiq123"){alert("Wrong");return}const pend=ads.filter(a=>a.status=="pending");let h="";if(pend.length>0){h+=`<div style=background:#fef2f2;border:1px solid #fecaca;padding:8px;border-radius:10px;margin-bottom:10px><b style=color:#dc2626>${pend.length} Pending - 03430864009</b></div>`;h+=pend.map(a=>`<div style=border:2px solid #ef4444;background:#fff7f7;padding:8px;border-radius:10px;margin-bottom:6px><b>${a.title} - Rs ${a.price}</b><br><small>${a.phone} - ${a.plan}</small>${a.payProof?`<br><img src="${a.payProof}" style=width:100%;height:100px;object-fit:cover;border-radius:6px>`:''}<br><button onclick=approveAd('${a.id}') style=background:#0a2e36;color:#fff;border:none;padding:6px 10px;border-radius:6px;margin-top:6px>Approve</button> <button onclick=deleteAd('${a.id}') style=background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:6px>Delete</button></div>`).join("")}else{h+=`<div style=background:#f0fdf4;border:1px solid #bbf7d0;padding:8px;border-radius:10px;margin-bottom:10px><b style=color:#16a34a>Login OK - ${ads.length} ads</b></div>`}h+=ads.map(a=>`<div style=border:1px solid #e5e7eb;padding:6px;border-radius:8px;margin-bottom:4px;display:flex;gap:6px><img src="${a.image}" style=width:40px;height:40px;border-radius:6px;object-fit:cover><div style=flex:1><b>${a.title}</b> Rs ${a.price}<br><small>${a.phone} ${a.status}</small></div><div><button onclick=approveAd('${a.id}') style=background:#0a2e36;color:#fff;border:none;padding:4px 8px;border-radius:6px;font-size:10px>Feat</button><br><button onclick=deleteAd('${a.id}') style=background:#ef4444;color:#fff;border:none;padding:3px 6px;border-radius:4px;font-size:9px;margin-top:3px>Del</button></div></div>`).join("");document.getElementById("adminList").innerHTML=h};window.approveAd=id=>{const a=ads.find(a=>a.id==id);if(a){a.status="live";a.featured=true;localStorage.setItem('sm_ads_v46',JSON.stringify(ads));alert("Approved FEATURED");checkAdmin();renderHome();renderMyAds()}};window.deleteAd=id=>{if(!confirm("Delete?"))return;ads=ads.filter(a=>a.id!=id);localStorage.setItem('sm_ads_v46',JSON.stringify(ads));checkAdmin();renderHome();renderMyAds()};initCats();renderHome();renderChatList();</script></body></html>
